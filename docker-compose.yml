services:
  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: spark-log-lab-master
    user: root
    env_file:
      - .env
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - .:/opt/spark-log-lab
    working_dir: /opt/spark-log-lab
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:3.5.1-python3
    container_name: spark-log-lab-worker-1
    user: root
    env_file:
      - .env
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - ${SPARK_WORKER_CORES}
      - --memory
      - ${SPARK_WORKER_MEMORY}
      - --webui-port
      - "8081"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - .:/opt/spark-log-lab
    working_dir: /opt/spark-log-lab
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:3.5.1-python3
    container_name: spark-log-lab-worker-2
    user: root
    env_file:
      - .env
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - ${SPARK_WORKER_CORES}
      - --memory
      - ${SPARK_WORKER_MEMORY}
      - --webui-port
      - "8081"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - .:/opt/spark-log-lab
    working_dir: /opt/spark-log-lab
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
